<!DOCTYPE html>
<html lang="PT-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style/register-organizacao.css" />
  <link rel="icon" href="img/logo-doa-certo.png" />
  <title>DoaCerto - Registro</title>
</head>

<body>
  <header class="header">
    <img src="img/logo-doa-certo.png" alt="Logo" class="logo" />
    <nav class="nav-links">
      <a href="/home.html">Home</a>
      <a href="">Sobre</a>
      <a href="/campanhas.html">Campanhas</a>
    </nav>
    <div class="auth-buttons">
      <div class="auth-buttons">
        <div class="dropdown">
          <button class="login-btn">
            Registrar-se <img src="img/menu-down.svg" height="18px" />
          </button>
          <div class="dropdown-options">
            <a href="/register-doador.html">Doador</a>
            <a href="/register-organizacao.html">Organização</a>
          </div>
        </div>
        <button class="login-btn">
          <a class="btn-login" href="/login.html">Login</a>
        </button>
      </div>
    </div>
  </header>
  <div class="page-central">
    <div class="background-header">
      <h1><b>Resgistre-se como</b> Organização</h1>
    </div>
    <div class="form">
      <div class="form-container">
        <form>
          <div class="form-grid">
            <div class="form-group">
              <label>Nome da Organização</label>
              <input type="text" placeholder="Nome da Organização" />
            </div>
            <div class="form-group">
              <label>CEP</label>
              <input type="text" placeholder="00000-000" />
            </div>
            <div class="form-group">
              <label>CNPJ</label>
              <input type="text" placeholder="00.000.000/0000-00" />
            </div>
            <div class="form-group">
              <label>Estado</label>
              <input type="text" placeholder="Estado" />
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" placeholder="Email" />
            </div>
            <div class="form-group">
              <label>Cidade</label>
              <input type="text" placeholder="Cidade" />
            </div>
            <div class="form-group">
              <label>Senha</label>
              <input type="password" placeholder="Senha" />
            </div>
            <div class="form-group">
              <label>Complemento</label>
              <input type="text" placeholder="Complemento" />
            </div>
            <div class="form-group">
              <label>Número de Telefone</label>
              <input type="tel" placeholder="Número" />
            </div>
            <div class="form-group">
              <label>Horário de Funcionamento</label>
              <div class="time-group">
                <input type="time" class="time-input" />
                <span>às</span>
                <input type="time" class="time-input" />
                <p>-</p>
                <input type="time" class="time-input" />
                <span>às</span>
                <input type="time" class="time-input" />
              </div>
            </div>
          </div>
          <div class="submit-container">
            <button type="submit" class="submit-btn">
              Finalizar
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 6L9 17l-5-5" />
              </svg>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>

</html>
